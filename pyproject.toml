[tool.poetry]
authors = [
  "Semyon Grigorev rsdpisuy@gmail.com",
  "Ekaterina Shemetova katyacyfra@gmail.com",
  "Max Nigmatulin mvnigma@gmail.com",
  "Anya Chistyakova chi.vinny0702@gmail.com",
]
description = "Python infrastructure to train paths selectors for symbolic execution engines."
license = "LICENSE"
name = "pysymgym"
package-mode = false
readme = "README.md"
version = "0.1.0"

[tool.poetry.dependencies]
aiohttp = "^3.13.5"
dataclasses-json = "^0.6.7"
func-timeout = "^4.3.5"
httplib2 = ">=0.31.2,<0.33.0"
joblib = "^1.5.3"
matplotlib = "^3.10.8"
natsort = "^8.4.0"
# Successor of the deprecated `pynvml` package (same `pynvml` module); torch
# and mlflow's GPU monitor import it. The old package emits a deprecation
# FutureWarning on every CUDA init.
nvidia-ml-py = "^13.0.1"
onnx = "^1.21.0"
onnxruntime = "^1.24.4"
optuna = ">=4.8,<6.0"
pandas = ">=2.3.3,<4.0.0"
psutil = "^7.2.2"
pydantic = "^2.13.0"
python = "^3.11"
tabulate = "^0.10.0"
torch = "^2.7.1"
torch-geometric = "^2.7.0"
tqdm = "^4.67.3"
websocket-client = "^1.9.0"
mlflow = "^3.11.1"
cattrs = "^26.1.0"
attrs = "^26.1.0"
onnxscript = "^0.7.2"

[tool.poetry.group.test.dependencies]
pytest = "^9.0.3"

[tool.poetry.group.formatter.dependencies]
ruff = ">=0.15.10,<0.17.0"

[tool.poetry.group.docs.dependencies]
sphinx = ">=7.2,<10"
furo = ">=2024.1"

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core==2.2.1"]

[tool.ruff]
include = ["pyproject.toml", "AIAgent/**/*.py", "*.ipynb", "tools/**/*.py", "docs/**/*.py"]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "B"]
ignore = ["E501"]
extend-select = ["E226"]
preview = true
explicit-preview-rules = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"
