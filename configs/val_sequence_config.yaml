OptunaConfig:
  n_startup_trials: 1
  n_trials: 1
  n_jobs: 1
  study_direction: "minimize"
  trial_uri: mlflow-artifacts:/<EXPERIMENT_ID>/<RUN_ID>/artifacts/trial.pkl

TrainingConfig:
  dynamic_dataset: True
  train_percentage: 0.7
  threshold_coverage: 100
  load_to_cpu: False
  epochs: 10
  percentile: 80

ValidationConfig:
    val_type: custom
    val_sequence: 
      - val_type: svms_each_step
        fail_immediately: False
        PlatformsConfig:
          - name: dotnet
            DatasetConfigs:
              - dataset_base_path: ../maps/DotNet/Maps/Root/bin/Release/net8.0
                dataset_description: ../maps/DotNet/Maps/dataset.json
            SVMSInfo:
              - name: VSharp
                launch_command: dotnet VSharp.ML.GameServer.Runner.dll --mode server --port {port}
                min_port: 35000
                max_port: 35050
                server_working_dir: ../GameServers/VSharp/VSharp.ML.GameServer.Runner/bin/Release/net8.0
        process_count: 1
      - val_type: loss
        batch_size: 4
    process_count: 1

MLFlowConfig:
  tracking_uri: http://127.0.0.1:8080
  experiment_name: <YOUR_EXPERIMENT_NAME>
