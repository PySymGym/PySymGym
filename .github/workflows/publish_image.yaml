name: Publish image to GHCR

on:
  push:
    branches: [main]
    paths:
      - ".github/docker/Dockerfile"
  pull_request:
    paths:
      - ".github/docker/Dockerfile"

concurrency:
  group: publish_image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish-image:
    runs-on: self-hosted
    container:
      image: ubuntu:24.04
    permissions:
      packages: write
    steps:
      - name: Install git
        run: |
          apt update && apt install -y git

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure repo
        run: |
          git config --global --add safe.directory /__w/PySymGym/PySymGym

      - name: Calculate Dockerfile hash
        id: hash
        run: |
          HASH=$(sha1sum .github/docker/Dockerfile | cut -d ' ' -f 1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Install deps
        run: |
          apt update && apt install -y curl
          curl https://get.docker.com/ | bash

      - name: Check whether the image is already published
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The tag is the sha1 of the Dockerfile, so the image for a given
          # hash is immutable: once its manifest is on GHCR, rebuilding and
          # re-pushing it is wasted work. check_ci_image.sh exits 0 when the
          # manifest exists, 1 when it does not, 2 on a non-retryable error.
          status=0
          .github/scripts/check_ci_image.sh "${{ steps.hash.outputs.hash }}" || status=$?
          if [ "$status" -eq 0 ]; then
              echo "published=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 1 ]; then
              echo "published=false" >> "$GITHUB_OUTPUT"
          else
              exit "$status"
          fi

      - name: Login to GitHub Container Registry
        if: steps.check.outputs.published == 'false'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: pysymgym
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image if needed
        if: steps.check.outputs.published == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .github/docker/
          push: true
          tags: |
            ghcr.io/pysymgym/pysymgym:${{ steps.hash.outputs.hash }}
