name: Build SVM-s and maps + Run training

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build_and_run-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The full pipeline (Dockerfile hash, build, data generation, training with
  # MLflow, dataset improvement, artifact upload) lives in the shared reusable
  # workflow; this file only selects its mode. See docs/developer.rst,
  # "Self-hosted end-to-end workflows".
  e2e:
    uses: ./.github/workflows/e2e_build_and_run.yml
    with:
      training-config: ../workflow/config_for_tests_loss_val.yml
      improvement-base-config: ../workflow/config_for_tests.yml
