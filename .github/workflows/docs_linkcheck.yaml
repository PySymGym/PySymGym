name: Docs link check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Install docs dependencies
        run: |
          uv sync --locked --only-group docs

      - name: Check external links
        # --no-sync: the env was just synced with --only-group docs; a bare
        # `uv run` would re-sync the full env (adding the test/lint groups).
        run: |
          uv run --no-sync sphinx-build -b linkcheck -D linkcheck_timeout=10 docs docs/_build/linkcheck
