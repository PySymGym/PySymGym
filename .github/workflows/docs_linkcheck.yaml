name: Docs link check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install poetry
        run: |
          pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.8"
          cache: "poetry"

      - name: Install docs dependencies
        run: |
          poetry install --only docs

      - name: Check external links
        run: |
          poetry run sphinx-build -b linkcheck -D linkcheck_timeout=10 docs docs/_build/linkcheck
