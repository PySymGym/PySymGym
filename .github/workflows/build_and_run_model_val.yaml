name: Build SVM-s and maps + Run training (model validation)

on: [push, pull_request]

jobs:
  calculate-dockerfile-hash:
    runs-on: self-hosted
    container:
      image: ubuntu:24.04
    outputs:
      dockerfile_hash: ${{ steps.hash.outputs.hash }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Calculate Dockerfile hash
        id: hash
        run: |
          HASH=$(sha1sum .github/docker/Dockerfile | cut -d ' ' -f 1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
  build-and-launch:
    needs: calculate-dockerfile-hash
    runs-on: self-hosted
    container:
      image: ghcr.io/pysymgym/pysymgym:${{ needs.calculate-dockerfile-hash.outputs.dockerfile_hash }}
    permissions:
      packages: read
    steps:
      - name: Debug
        run: |
          printenv
          dotnet --version

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.8"

      - name: Install poetry
        run: |
          pip install poetry==2.2.1

      - name: Install dependencies
        run: |
          poetry --ansi install

      - name: Build V# game server
        working-directory: ./GameServers/VSharp/
        run: |
          dotnet build VSharp.ML.GameServer.Runner -c Release

      - name: Build .NET game maps
        working-directory: ./maps/DotNet/Maps
        run: |
          dotnet build Root -c Release

      - name: Generate initial data for training
        working-directory: ./GameServers/VSharp/VSharp.ML.GameServer.Runner/bin/Release/net8.0
        run: |
          dotnet VSharp.ML.GameServer.Runner.dll \
            --mode generator \
            --datasetbasepath ${GITHUB_WORKSPACE}/maps/DotNet/Maps/Root/bin/Release/net8.0 \
            --datasetdescription ${GITHUB_WORKSPACE}/workflow/dataset_for_tests_net.json \
            --stepstoserialize 200

      - name: Move SerializedEpisodes
        working-directory: ./AIAgent
        run: |
          mkdir report
          mv ../GameServers/VSharp/VSharp.ML.GameServer.Runner/bin/Release/net8.0/8100/SerializedEpisodes/ report/

      - name: Run training with MLflow
        working-directory: ./AIAgent
        run: |
          # Same same-step + readiness pattern as build_and_run.yaml: a
          # background process does not survive a step boundary, so the server
          # must live in the step that uses it. Readiness is polled (stdlib
          # only) instead of a fixed sleep, which races with the variable
          # startup time.
          poetry --ansi run python -m mlflow server -h 127.0.0.1 -p 8080 --serve-artifacts > mlflow.log 2>&1 &
          MLFLOW_PID=$!
          trap 'kill $MLFLOW_PID 2>/dev/null || true' EXIT

          python3 - <<'PY'
          import time
          import urllib.request

          deadline = time.monotonic() + 120
          while True:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=5) as response:
                      if response.status == 200:
                          break
              except OSError:
                  pass
              if time.monotonic() >= deadline:
                  raise SystemExit("MLflow server did not become ready on http://127.0.0.1:8080/health")
              time.sleep(2)
          PY

          poetry --ansi run python3 run_training.py --config ../workflow/config_for_tests_send_model_val.yml

      - name: Upload mlartifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: AIAgent/mlartifacts/**/**/artifacts/**

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs
          path: AIAgent/*.log

      - name: Sanity check
        working-directory: ./AIAgent
        run: |
          if ls report/study.pkl 1> /dev/null 2>&1; then
              echo "PKL files found."
          else
              echo "No PKL files found."
              exit 1
          fi
