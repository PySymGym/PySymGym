name: Test runstrat tool

on:
  push:
    branches: [main]
    paths:
      - 'tools/runstrat/**'
  pull_request:
    paths:
      - 'tools/runstrat/**'

jobs:
  calculate-dockerfile-hash:
    runs-on: self-hosted
    container:
      image: ubuntu:24.04
    outputs:
      dockerfile_hash: ${{ steps.hash.outputs.hash }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Calculate Dockerfile hash
        id: hash
        run: |
          HASH=$(sha1sum .github/docker/Dockerfile | cut -d ' ' -f 1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          
  build-and-launch:
    needs: calculate-dockerfile-hash
    runs-on: self-hosted
    container:
      image: ghcr.io/pysymgym/pysymgym:${{ needs.calculate-dockerfile-hash.outputs.dockerfile_hash }}
    permissions:
      packages: read
    steps:
      - name: Debug
        run: |
          printenv
          dotnet --version

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.8"

      - name: Install poetry
        run: |
          pip install poetry

      - name: Install dependencies
        run: |
          # --sync: self-hosted runners cache poetry's venv across runs; a
          # plain install never removes packages dropped from the lockfile.
          poetry --ansi install -q --sync

      - name: Verify cached venv integrity
        run: |
          # Same shared self-hosted venv as the e2e workflows: see the
          # matching step in e2e_build_and_run.yml for why a file-broken
          # venv must be rebuilt when torch cannot import.
          if ! poetry run python -c "import torch" 2>/dev/null; then
              echo "torch import failed — rebuilding cached venv from scratch"
              rm -rf "$(poetry env info -p)"
              poetry --ansi install -q --sync
              poetry run python -c "import torch"
          fi

      - name: Build V# game server
        working-directory: ./GameServers/VSharp/
        run: |
          dotnet build VSharp.ML.GameServer.Runner -c Release

      - name: Build .NET maps for tests
        working-directory: ./tools/runstrat/resources
        run: |
          dotnet build ForTests -c Release

      - name: Run tests
        working-directory: ./tools/runstrat
        run: |
          poetry run pytest tests -sv -o log_file="artifacts/runstrat.log" -o log_file_level="DEBUG"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: tools/runstrat/artifacts/*
