name: Test runstrat tool

on:
  push:
    branches: [main]
    paths:
      - 'tools/runstrat/**'
  pull_request:
    paths:
      - 'tools/runstrat/**'

jobs:
  calculate-dockerfile-hash:
    runs-on: self-hosted
    container:
      image: ubuntu:24.04
    outputs:
      dockerfile_hash: ${{ steps.hash.outputs.hash }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Calculate Dockerfile hash
        id: hash
        run: |
          HASH=$(sha1sum .github/docker/Dockerfile | cut -d ' ' -f 1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          
  build-and-launch:
    needs: calculate-dockerfile-hash
    runs-on: self-hosted
    container:
      image: ghcr.io/pysymgym/pysymgym:${{ needs.calculate-dockerfile-hash.outputs.dockerfile_hash }}
    permissions:
      packages: read
    steps:
      - name: Debug
        run: |
          printenv
          dotnet --version

      - name: Prepare the Python environment
        uses: ./.github/actions/checkout-poetry

      - name: Build the .NET game server and maps
        uses: ./.github/actions/dotnet-build
        with:
          maps-working-directory: ./tools/runstrat/resources
          maps-project: ForTests

      - name: Run tests
        working-directory: ./tools/runstrat
        run: |
          poetry run pytest tests -sv -m e2e -o log_file="artifacts/runstrat.log" -o log_file_level="DEBUG"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: tools/runstrat/artifacts/*
