name: Build and test USVM submodule

on:
  push:
    branches: [main]
    paths:
      - 'GameServers/usvm'
  pull_request:
    paths:
      - 'GameServers/usvm'

jobs:
  build-and-test:
    runs-on: self-hosted
    container:
      image: ubuntu:24.04
    steps:
      - name: Download & install necessary dependencies
        # nodejs/npm are required by :usvm-ts-fast-check (npm ci/build of the
        # fast-check adapter); ubuntu 24.04 ships node 22, which satisfies
        # the adapter's engines requirement (>=18.18.0)
        run: apt update && apt install -y git nodejs npm

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '11'
          cache: 'maven'

      - name: Build and test usvm
        working-directory: ./GameServers/usvm/
        run: |
          ./gradlew build --no-daemon
