name: Build and test USVM submodule

on:
  push:
    branches: [main]
    paths:
      - 'GameServers/usvm'
  pull_request:
    paths:
      - 'GameServers/usvm'

jobs:
  build-and-test:
    # Runs on the host, not in a container: the usvm test suite kills
    # orphaned descendants and asserts they are gone, which requires a
    # reaping init. A container's PID 1 does not reap orphans, so the
    # killed descendants linger as zombies — visible to both
    # kill(pid, 0) (JS tests) and ProcessHandle.isAlive()/onExit() (JVM
    # tests) — and the process-management tests fail. The host's systemd
    # reaps immediately. See #659.
    runs-on: self-hosted
    steps:
      - name: Setup Node.js
        # :usvm-ts-fast-check runs the fast-check adapter's JS tests, whose
        # TS entry-point loading needs node >= 20-class CJS/ESM interop
        # (node 18 breaks it: entrypoint.export.not-found, 41/138 tests).
        # See #659.
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '11'
          cache: 'maven'

      - name: Build and test usvm
        working-directory: ./GameServers/usvm/
        run: |
          ./gradlew build --no-daemon
