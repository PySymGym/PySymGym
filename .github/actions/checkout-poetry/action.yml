name: Checkout and prepare the Python environment
description: >-
  Checks out the repository with submodules, sets up Python, installs the
  pinned Poetry, and installs the project dependencies into the self-hosted
  runner's cached venv (self-healing). Shared by the self-hosted build
  workflows; see docs/developer.rst, "Self-hosted end-to-end workflows".
runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11.8"

    - name: Install poetry
      shell: bash
      run: |
        pip install poetry==2.2.1

    - name: Install dependencies
      shell: bash
      run: |
        # Self-hosted runners cache poetry's venv across runs, and a plain
        # install never removes packages dropped from the lockfile (stale
        # pynvml kept leaking into the env after #617-S1 removed it).
        # --sync purges them.
        #
        # --sync can also fail outright when it must downgrade a cached
        # package: pip's uninstall renames the old files into a temp dir,
        # and on this runner /tmp is on a different filesystem than the
        # venv, so the rename dies with "Invalid cross-device link"
        # ("Cannot install mlflow-skinny" after #654 bumped mlflow on
        # main while older branches still lock 3.11.1). Pointing TMPDIR
        # at the venv's own filesystem keeps the rename on-device; if the
        # install fails for any other reason, rebuild the venv from
        # scratch — a fresh install never uninstalls.
        export TMPDIR="$(poetry config cache-dir)/pip-tmp"
        mkdir -p "$TMPDIR"
        if ! poetry --ansi install --sync; then
            echo "poetry install --sync failed — rebuilding cached venv from scratch"
            # env info -p fails when no venv exists yet (fresh runner);
            # guard so the rebuild still proceeds.
            venv_path="$(poetry env info -p 2>/dev/null || true)"
            [ -n "$venv_path" ] && rm -rf "$venv_path"
            poetry --ansi install --sync
        fi

    - name: Verify cached venv integrity
      shell: bash
      run: |
        # The cached venv can be file-broken even when poetry considers it
        # complete: a foreign CUDA stack (nvidia-*-cu13) that once lived
        # here shares site-packages paths with our nvidia-*-cu12 packages
        # (both own e.g. nvidia/cudnn/lib/libcudnn.so.9), and --sync's
        # removal of the foreign stack deletes the shared libraries,
        # breaking 'import torch'. If torch cannot import, rebuild the
        # venv from scratch once; --sync keeps it clean afterwards.
        if ! poetry run python -c "import torch" 2>/dev/null; then
            echo "torch import failed — rebuilding cached venv from scratch"
            rm -rf "$(poetry env info -p)"
            poetry --ansi install --sync
            poetry run python -c "import torch"
        fi
